[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = sentinel/tests/unit sentinel/tests/integration
pythonpath = sentinel .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --capture=sys

[tool.pytest.ini_options]
asyncio_mode = "auto"
