version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sentinel-backend
    command: uvicorn app.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=SENTINEL
      - APP_ENV=production
      - DATABASE_URL=sqlite+aiosqlite:///./data/sentinel.db
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - YOLO_MODEL_PATH=data/models/yolov8n.pt
      - YOLO_DEVICE=cpu
    volumes:
      - sentinel-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sentinel-dashboard
    command: streamlit run dashboard/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - API_HOST=backend
      - API_PORT=8000
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - sentinel-data:/app/data
    restart: unless-stopped

volumes:
  sentinel-data:

